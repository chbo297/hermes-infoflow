# Hermes Agent plugin manifest for the Infoflow (如流) channel adapter.
#
# IMPORTANT: `name` MUST equal:
#   1. The entry-point key in pyproject.toml:
#      [project.entry-points."hermes_agent.plugins"] infoflow = "hermes_infoflow"
#   2. The `name` argument passed to ctx.register_platform(name="infoflow", ...)
#      inside hermes_infoflow/adapter.py.
# Otherwise hermes treats entry-point and directory installs as two distinct
# plugins and they may shadow each other unpredictably.
#
# Layout note: hermes-agent's directory loader requires ``__init__.py`` at the
# plugin dir root (``hermes_cli/plugins.py::_load_directory_module``).  This
# repo ships a root-level ``__init__.py`` that re-exports the public API from
# the ``hermes_infoflow/`` sub-package.  Supported installs converge on the
# same plugin id and directory:
#
#   A. ``hermes plugins install`` + ``scripts/normalize.sh`` — git clone,
#      then flatten into the same canonical directory layout as B/D.
#   B. ``hermes-infoflow-tools --mode extract`` — unpacks sdist then runs the
#      same normalizer to flatten ``hermes_infoflow/*`` into the plugin dir root
#      (overwrites root ``__init__.py`` with the flattened copy).
#      ``--mode pip`` is a deprecated compatibility alias for this directory-style
#      deploy, not an entry-point install.
#   C. ``pip install hermes-infoflow`` + ``hermes-infoflow-deploy`` — copy
#      the installed package into the same canonical directory layout.
#   D. ``scripts/deploy.sh`` — thin wrapper around the same deploy.py
#      normalizer used by B/C.
#
# There is NO ``entry_module`` field hermes-agent reads; pointing at a nested
# package via the manifest would not help.
#
# IMPORTANT: the root ``__init__.py`` mirrors exports from
# ``hermes_infoflow/__init__.py``.  When adding public symbols or bumping the
# version, update BOTH files.  See the root ``__init__.py`` header comment
# for the full maintenance rules.
manifest_version: 1
name: infoflow
label: Infoflow (如流)
kind: platform
version: 2026.6.11
description: >
  Baidu Infoflow (如流) channel plugin for Hermes Agent.
  Receives messages via webhook or websocket and sends via REST API.
author: chengbo05 <chengbo05@baidu.com>

# ``requires_env`` / ``optional_env`` are surfaced by hermes_cli/config.py's
# platform-plugin env var injector in the `hermes config` setup wizard only
# when Hermes loads this as a directory plugin. All complete install commands
# documented in README normalize/deploy to ``~/.hermes/plugins/infoflow`` and
# therefore use this manifest. A raw ``pip install hermes-infoflow`` without
# ``hermes-infoflow-deploy`` remains entry-point-only and does not read
# ``plugin.yaml``; it is kept for discovery compatibility, not as a complete
# install path.
requires_env:
  - name: INFOFLOW_APP_KEY
    description: "Infoflow app key (token endpoint identity)"
    prompt: "Infoflow appKey"
    password: false
  - name: INFOFLOW_APP_SECRET
    description: "Infoflow app secret (raw; will be MD5'd lowercase hex)"
    prompt: "Infoflow appSecret"
    password: true

optional_env:
  - name: INFOFLOW_CONNECTION_MODE
    description: "Inbound receive transport: webhook or websocket (default webhook)"
    prompt: "Connection mode (webhook/websocket)"
    password: false
  - name: INFOFLOW_API_HOST
    description: "Infoflow API host root (default https://api.im.baidu.com)"
    prompt: "Infoflow API host (default https://api.im.baidu.com)"
    password: false
  - name: INFOFLOW_CHECK_TOKEN
    description: "Infoflow check token; required only in webhook mode for echostr signature verification"
    prompt: "Infoflow checkToken (webhook mode)"
    password: true
  - name: INFOFLOW_ENCODING_AES_KEY
    description: "Infoflow EncodingAESKey; required only in webhook mode (base64URL-safe, 16/24/32 raw bytes)"
    prompt: "Infoflow EncodingAESKey (webhook mode)"
    password: true

  - name: INFOFLOW_ADMIN_USER
    description: "Admin userid list, comma-separated — only these users have full access to sensitive tools"
    prompt: "Admin userids, comma-separated"
    password: false
  - name: INFOFLOW_APP_AGENT_ID
    description: "Infoflow agent ID (required for private-chat recall)"
    prompt: "Infoflow appAgentId"
    password: false
  - name: INFOFLOW_ROBOT_NAME
    description: "Optional bot display name used to detect early group @-mentions before robot_id is known"
    prompt: "Bot display name"
    password: false
  - name: INFOFLOW_ROBOT_ID
    description: "Optional Infoflow IM robot_id / imid; normally auto-discovered and persisted"
    prompt: "Infoflow robot_id"
    password: false
  - name: INFOFLOW_PORT
    description: "Webhook listen port (default 26521)"
    prompt: "Webhook port"
    password: false
  - name: INFOFLOW_HOST
    description: "Webhook bind host (default 0.0.0.0)"
    prompt: "Webhook bind host"
    password: false
  - name: INFOFLOW_WEBHOOK_PATH
    description: "Webhook URL path (default /webhook/infoflow)"
    prompt: "Webhook path"
    password: false
  - name: INFOFLOW_OP_CHANNEL
    description: "Single operation channel for notices and default delivery (uuapName or group:<id>; numeric value is a group)"
    prompt: "Operation channel target"
    password: false
  - name: INFOFLOW_REPLY_MODE
    description: "Group reply mode: ignore / record / mention-only / mention-and-watch (default) / proactive"
    prompt: "Reply mode"
    password: false
  - name: INFOFLOW_REQUIRE_MENTION
    description: "If true, only respond in groups when bot is @-mentioned (default true)"
    prompt: "Require mention? (true/false)"
    password: false
  - name: INFOFLOW_WATCH_MENTIONS
    description: "Single name/id or comma-separated names/ids; @-mentioning any of them triggers the bot in mention-and-watch mode"
    prompt: "Watch mentions (single or comma-separated)"
    password: false
  - name: INFOFLOW_WATCH_REGEX
    description: "Legacy single regex triggering the bot when matched in message text. Add more legacy patterns with INFOFLOW_WATCH_REGEX_* env vars. Prefer named rules with INFOFLOW_REGEX_WATCH_<KEY> and optional INFOFLOW_REGEX_SKILL_<KEY> for skill hints."
    prompt: "Watch regex pattern"
    password: false
  - name: INFOFLOW_OUTBOUND_MENTION_BLACKLIST
    description: "Comma-separated outbound @ blacklist. Robot-sent group messages will not directly @ user:<uuapName> or bot:<agentId> entries; @all and emoji reactions are unaffected."
    prompt: "Outbound @ blacklist (user:alice,bot:123)"
    password: false
  - name: INFOFLOW_FOLLOW_UP
    description: "Enable follow-up replies after bot responds (default true). When true, the bot continues to engage messages in the same group within the follow-up window."
    prompt: "Follow-up enabled? (true/false)"
    password: false
  - name: INFOFLOW_FOLLOW_UP_WINDOW
    description: "Follow-up window in seconds after last bot reply (default 300)"
    prompt: "Follow-up window seconds"
    password: false
  - name: INFOFLOW_IDLE_SESSION_RESET_SECONDS
    description: "Infoflow ordinary-message idle session reset threshold in seconds (default 2700, 0 disables)"
    prompt: "Idle session reset seconds"
    password: false
  - name: INFOFLOW_GROUPS
    description: "Per-group config overrides as JSON, keyed by group ID. Each entry can override reply_mode / watch_mentions / watch_regex / follow_up / follow_up_window / system_prompt."
    prompt: "Per-group config (JSON)"
    password: false
  - name: INFOFLOW_ALLOWED_USERS
    description: "Comma-separated uuapNames allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: INFOFLOW_ALLOW_ALL_USERS
    description: "Allow all users to talk to the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: HERMES_STATE_DIR
    description: "Override the directory holding hermes state (sent-messages.db etc.). Defaults to ~/.hermes/state."
    prompt: "Hermes state directory"
    password: false
  - name: INFOFLOW_DASHBOARD_ENABLED
    description: "Enable localhost session dashboard at /webhook/infoflow/dashboard (default true)"
    prompt: "Dashboard enabled? (true/false)"
    password: false
  - name: INFOFLOW_DASHBOARD_EVENT_BUFFER
    description: "Max events kept per session in dashboard memory (default 2000)"
    prompt: "Dashboard event buffer size"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_ENABLED
    description: "Enable Session Tracker Web UI at /webhook/infoflow/sessiontracker (default true)"
    prompt: "Session Tracker enabled? (true/false)"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_FULL_USER_MESSAGE
    description: "Allow admin Session Tracker viewers (resolved from code) to see full Hermes user messages; non-admin viewers still see only text after [Message] (default false)"
    prompt: "Admin Session Tracker full user message? (true/false)"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_TERMINAL_ENABLED
    description: "Enable admin-only private-chat terminal tab in Session Tracker (default false)"
    prompt: "Admin Session Tracker terminal enabled? (true/false)"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_TERMINAL_LOCALHOST_ONLY
    description: "Restrict Session Tracker terminal websocket to localhost/reverse-proxy-local requests (default true)"
    prompt: "Session Tracker terminal localhost only? (true/false)"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_TERMINAL_CWD
    description: "Working directory for Session Tracker terminal shells (default ~/.hermes/plugins/infoflow when present)"
    prompt: "Session Tracker terminal cwd"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_TERMINAL_RETENTION_MINUTES
    description: "Minutes to keep detached Session Tracker terminal PTYs alive after the web page disconnects (default 2880, max 48h)"
    prompt: "Session Tracker terminal retention minutes"
    password: false
  - name: INFOFLOW_SESSIONTRACKER_TERMINAL_MAX_PER_ADMIN
    description: "Maximum concurrent Session Tracker terminal PTYs per admin user (default 4)"
    prompt: "Session Tracker terminal max sessions per admin"
    password: false
